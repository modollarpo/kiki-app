name: CI

# Pull-request and feature-branch checks only. Deployments on `main` are
# handled by deploy.yml, which runs the same checks before building/pushing.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  check:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --engine-strict=false
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
