name: CI

# Pull-request and feature-branch checks only. Deployments on `main` are
# handled by deploy.yml, which runs the same checks before building/pushing.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Least privilege: CI only ever reads the repository. Actions are pinned to
# full commit SHAs so a compromised/moved tag cannot inject code.
permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  check:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --engine-strict=false
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --engine-strict=false
      # Surfaces high/critical advisories without blocking merges while the
      # remaining dev-only advisories are triaged.
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
