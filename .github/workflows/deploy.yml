name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: kiki-agent-rg
  ACR_NAME: kikiagentacr
  CONTAINER_APP: kiki-app
  IMAGE: kiki-app

jobs:
  build-and-deploy:
    name: Type-check, test & deploy to Container App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        # Remote build (no runner Docker needed). Tags: latest + immutable commit sha.
        run: |
          az acr build \
            -r ${{ env.ACR_NAME }} \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -f Dockerfile .

      - name: Deploy to Container App
        # Unique immutable tag forces a fresh image pull + new revision.
        run: |
          az containerapp update \
            -g ${{ env.RESOURCE_GROUP }} \
            -n ${{ env.CONTAINER_APP }} \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}"
