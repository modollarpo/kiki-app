<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  @page {
    size: A4;
    margin: 20mm 22mm 25mm 22mm;
    @bottom-center {
      content: "KIKI Agent™ — STOREGRILL INC LTD | Confidential";
      font-family: 'JetBrains Mono', monospace;
      font-size: 7pt;
      color: #6B7280;
    }
    @bottom-right {
      content: counter(page);
      font-family: 'JetBrains Mono', monospace;
      font-size: 7pt;
      color: #6B7280;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 10pt;
    line-height: 1.55;
    color: #111827;
    max-width: 170mm;
    margin: 0 auto;
    padding: 0;
  }

  /* --- Cover Page --- */
  .cover {
    page-break-after: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 250mm;
    padding: 0;
  }
  .cover .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36pt;
    font-weight: 700;
    color: #005CFF;
    letter-spacing: -0.02em;
    margin-bottom: 8pt;
  }
  .cover .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11pt;
    color: #6B7280;
    letter-spacing: 0.02em;
    margin-bottom: 40pt;
  }
  .cover .doc-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18pt;
    font-weight: 500;
    color: #111827;
    margin-bottom: 20pt;
    max-width: 140mm;
  }
  .cover .divider {
    width: 60mm;
    height: 1pt;
    background: #005CFF;
    margin: 16pt auto;
  }
  .cover .meta {
    font-family: 'Inter', sans-serif;
    font-size: 9pt;
    color: #6B7280;
    line-height: 1.8;
    margin-top: 20pt;
  }
  .cover .legal {
    font-family: 'Inter', sans-serif;
    font-size: 7.5pt;
    color: #9CA3AF;
    margin-top: 50pt;
    line-height: 1.5;
  }

  /* --- Headings --- */
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18pt;
    font-weight: 700;
    color: #005CFF;
    margin-top: 24pt;
    margin-bottom: 12pt;
    padding-bottom: 4pt;
    border-bottom: 1.5pt solid #005CFF;
    page-break-after: avoid;
  }
  h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13pt;
    font-weight: 700;
    color: #111827;
    margin-top: 18pt;
    margin-bottom: 8pt;
    page-break-after: avoid;
  }
  h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11pt;
    font-weight: 500;
    color: #374151;
    margin-top: 14pt;
    margin-bottom: 6pt;
    page-break-after: avoid;
  }
  h4 {
    font-family: 'Inter', sans-serif;
    font-size: 10pt;
    font-weight: 700;
    color: #111827;
    margin-top: 12pt;
    margin-bottom: 4pt;
  }

  p { margin: 4pt 0 8pt 0; }

  /* --- Tables --- */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 10pt 0;
    font-size: 8.5pt;
  }
  th {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    background: #005CFF;
    color: #FFFFFF;
    text-align: left;
    padding: 5pt 6pt;
    font-size: 8pt;
  }
  td {
    padding: 4pt 6pt;
    border-bottom: 0.5pt solid #E5E7EB;
  }
  tr:nth-child(even) td {
    background: #F9FAFB;
  }

  /* --- Lists --- */
  ul, ol { margin: 4pt 0; padding-left: 18pt; }
  li { margin-bottom: 2pt; }

  /* --- Code / Monospace --- */
  code, pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8pt;
    background: #F3F4F6;
    padding: 1pt 3pt;
    border-radius: 2px;
  }
  pre {
    padding: 6pt 8pt;
    line-height: 1.3;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* --- Blockquote --- */
  blockquote {
    border-left: 3pt solid #005CFF;
    margin: 10pt 0;
    padding: 6pt 12pt;
    background: #F0F4FF;
    font-style: italic;
    color: #374151;
  }

  /* --- HR --- */
  hr {
    border: none;
    border-top: 0.5pt solid #D1D5DB;
    margin: 16pt 0;
  }

  /* --- Page break --- */
  .page-break { page-break-before: always; }

  /* --- TOC --- */
  .toc { margin: 12pt 0; }
  .toc a {
    display: block;
    padding: 2pt 0;
    color: #005CFF;
    text-decoration: none;
    font-size: 9pt;
    font-family: 'Inter', sans-serif;
  }
  .toc a:hover { text-decoration: underline; }

  /* --- Accent highlight --- */
  .accent-box {
    background: #F0F4FF;
    border: 0.5pt solid #D1D9E8;
    border-radius: 3px;
    padding: 8pt 10pt;
    margin: 10pt 0;
    font-size: 9pt;
  }
  .accent-box strong { color: #005CFF; }

  strong { color: #111827; }
  em { color: #6B7280; }
  a { color: #005CFF; }
</style>
</head>
<body>

<div class="cover">
  <div class="brand">KIKI Agent™</div>
  <div class="tagline">Autonomous LTV Campaign Execution</div>
  <div class="divider"></div>
  <div class="doc-title">{{TITLE}}</div>
  <div class="meta">
    <strong>Founder:</strong> Ariyo Dolapo<br>
    <strong>Date:</strong> {{DATE}}<br>
    <strong>Status:</strong> Confidential — {{STATUS}}
  </div>
  <div class="legal">
    KIKI Agent™ — A STOREGRILL INC LTD Company<br>
    Registered in England & Wales
  </div>
</div>

{{CONTENT}}

</body>
</html>
